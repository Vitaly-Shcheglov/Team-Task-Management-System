<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Frontend Проект</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Приложение задач</h1>
  </header>

  <main>
    <section id="auth-section" class="auth-section">
      <h2 id="auth-title">Вход</h2>
      <form id="login-form" class="auth-form" autocomplete="off" novalidate method="post" action="#">
        <div class="form-field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" name="email" placeholder="you@example.com" required />
        </div>
        <div class="form-field">
          <label for="login-password">Пароль</label>
          <input type="password" id="login-password" name="password" placeholder="Пароль" required />
        </div>
        <button type="submit" class="btn btn-primary">Войти</button>
        <p class="form-switch">
          Нет учётной записи? <a href="#" id="show-register-link">Зарегистрироваться</a>
        </p>
      </form>

      <form id="register-form" class="auth-form" autocomplete="off" novalidate method="post" action="#" style="display: none;">
        <div class="form-field">
          <label for="reg-first-name">Имя</label>
          <input type="text" id="reg-first-name" name="first_name" placeholder="Ваше имя" required />
        </div>
        <div class="form-field">
          <label for="reg-middle-name">Отчество</label>
          <input type="text" id="reg-middle-name" name="middle_name" placeholder="Ваше отчество" />
        </div>
        <div class="form-field">
          <label for="reg-last-name">Фамилия</label>
          <input type="text" id="reg-last-name" name="last_name" placeholder="Ваша фамилия" required />
        </div>
        <div class="form-field">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" name="email" placeholder="you@example.com" required />
        </div>
        <div class="form-field">
          <label for="reg-password">Пароль</label>
          <input type="password" id="reg-password" name="password" placeholder="Минимум 8 символов" required minlength="8" />
        </div>
        <div class="form-field">
          <label for="reg-password-repeat">Повторите пароль</label>
          <input type="password" id="reg-password-repeat" name="password2" placeholder="Повтор пароля" required minlength="8" />
        </div>
        <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
        <p class="form-switch">
          Уже есть учётная запись? <a href="#" id="show-login-link">Войти</a>
        </p>
      </form>

      <div id="auth-status" class="auth-status" aria-live="polite"></div>
    </section>

    <section id="tasks-section" class="tasks-section" hidden>
      <h2>Задачи</h2>
      <form id="task-form" autocomplete="off" class="task-form" method="post" action="#">
        <input type="text" id="task-input" placeholder="Добавить новую задачу" required />
        <button type="submit">Добавить</button>
      </form>
      <ul id="task-list" class="task-list"></ul>
      <button id="logout-btn" class="btn-ghost" type="button">Выйти</button>
    </section>
  </main>

  <script src="/static/frontend/main.js"></script>
  <script src="/static/frontend/auth.js"></script>
  <script src="/static/frontend/tasks.js"></script>

  <script>
    document.getElementById('show-register-link').onclick = function(e) {
      e.preventDefault();
      document.getElementById('login-form').style.display = 'none';
      document.getElementById('register-form').style.display = 'block';
      document.getElementById('auth-title').innerText = 'Регистрация';
    };

    document.getElementById('show-login-link').onclick = function(e) {
      e.preventDefault();
      document.getElementById('register-form').style.display = 'none';
      document.getElementById('login-form').style.display = 'block';
      document.getElementById('auth-title').innerText = 'Вход';
    };
  </script>
</body>
</html>
