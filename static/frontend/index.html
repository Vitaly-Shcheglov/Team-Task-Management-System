
{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Frontend Проект</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header>
    <h1>Приложение задач</h1>
  </header>

  <main>
    <section id="auth-section" class="auth-section">
      <h2>Вход</h2>
      <form id="auth-form" autocomplete="off">
        <label for="email">Email</label>
        <input type="email" id="email" required />
        <label for="password">Пароль</label>
        <input type="password" id="password" required />
        <button type="submit">Войти</button>
      </form>
      <div id="auth-error" class="error" aria-live="polite"></div>
    </section>

    <section id="tasks-section" class="tasks-section" hidden>
      <h2>Задачи</h2>
      <form id="task-form" autocomplete="off" class="task-form">
        <input type="text" id="task-input" placeholder="Добавить новую задачу" required />
        <button type="submit">Добавить</button>
      </form>
      <ul id="task-list" class="task-list"></ul>
      <button id="logout-btn" class="btn-ghost" type="button">Выйти</button>
    </section>
  </main>

  <script src="{% static 'frontend/main.js' %}"></script>
  <script src="{% static 'frontend/auth.js' %}"></script>
  <script src="{% static 'frontend/tasks.js' %}"></script>
</body>
</html>
